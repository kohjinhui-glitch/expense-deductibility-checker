# Nginx server config for the Expense Deductibility Checker.
#
# The listen port is hardcoded to 3000 — must match `port` in airbase.json.
# We can't use envsubst at runtime because /etc/nginx/conf.d is read-only when
# nginx runs as the non-root `app` user that Airbase requires.

server {
    listen 3000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pure static site — no client-side routing fallback. Serve files as-is,
    # 404 if missing.
    #
    # Everything is served with Cache-Control: no-cache ("revalidate before
    # use", not "don't cache") so a redeploy shows up immediately. Without
    # this, browsers apply heuristic caching to app.js/styles.css and can keep
    # running a stale script against a fresh data.json for days — the code and
    # the data must never skew. All files are small; revalidation is a 304.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Compress text assets. Excel and PNG are already compressed containers.
    # text/html is gzipped by default — no need to list it.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    server_tokens off;
}
